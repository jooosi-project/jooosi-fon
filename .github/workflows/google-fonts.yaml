name: "Update google webfont cache"

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at midnight UTC

jobs:
  update-webfont-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          ref: master

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x # Run with latest stable Deno.
          cache: true

      - name: Install dependencies
        working-directory: deploy/webfonts
        run: deno install

      - name: Update webfont data
        working-directory: deploy/google-fonts-cache
        run: deno run -A main.ts
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}

      # commit changes
      - name: Commit changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Update webfont data"

      - name: Push changes
        run: git push origin HEAD:master
